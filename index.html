<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=5.0, user-scalable=yes">
  <meta name="theme-color" content="#0d0402">
  <title>Cocktail Digest</title>
  <link rel="stylesheet" href="./style.css">
</head>
<body>
  <!-- Ambient Atmospheric Background -->
  <div class="ambient-lounge" aria-hidden="true">
    <div class="ambient-glow orb-1"></div>
    <div class="ambient-glow orb-2"></div>
    <div id="garnishCanvas" class="garnish-canvas"></div>
  </div>

  <div class="app-container">
    <!-- Unified Top Bar -->
    <header class="bar-header" role="banner">
      <div class="header-left">
        <button id="headerBackBtn" class="neo-btn header-nav-btn hidden" aria-label="Menu" title="Menu">
          <span class="back-arrow" aria-hidden="true">←</span>
          <span class="btn-text">Menu</span>
        </button>
        <h1 class="brand-title">COCKTAIL DIGEST</h1>
      </div>
      <div class="header-right">
        <button id="soundToggleBtn" class="neo-btn icon-btn" aria-label="Toggle Sound" title="Toggle Sound">
          <svg id="soundIconOn" class="icon" viewBox="0 0 24 24" width="20" height="20" aria-hidden="true" fill="none" stroke="currentColor" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round">
            <polygon points="11 5 6 9 2 9 2 15 6 15 11 19 11 5"></polygon>
            <path d="M19.07 4.93a10 10 0 0 1 0 14.14M15.54 8.46a5 5 0 0 1 0 7.07"></path>
          </svg>
          <svg id="soundIconOff" class="icon hidden" viewBox="0 0 24 24" width="20" height="20" aria-hidden="true" fill="none" stroke="currentColor" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round">
            <polygon points="11 5 6 9 2 9 2 15 6 15 11 19 11 5"></polygon>
            <line x1="23" y1="9" x2="17" y2="15"></line>
            <line x1="17" y1="9" x2="23" y2="15"></line>
          </svg>
        </button>
      </div>
    </header>

    <main id="mainContent" class="main-stage" role="main">

      <!-- SYSTEM STATE (LOADING / ERROR) -->
      <section id="systemStateView" class="view-panel active">
        <div class="state-card neo-glass-surface">
          <h2 id="systemStateTitle" class="state-title">Loading</h2>
          <p id="systemStateDesc" class="state-desc"></p>
          <button id="systemRetryBtn" class="neo-btn primary-action hidden">Try again</button>
        </div>
      </section>

      <!-- MAIN MENU -->
      <section id="menuView" class="view-panel hidden" aria-label="Main Menu">
        <div class="menu-stage">
          <!-- Today's Puzzle Card -->
          <article class="menu-card today-hero-card neo-glass-surface" id="menuTodayCard">
            <h2 class="section-title">Today's Puzzle</h2>
            <h3 id="menuTodayFlightTitle" class="today-flight-title">Loading...</h3>
            
            <div id="menuTodayStatusWrap" class="today-status-wrap">
              <span id="menuTodayStatusText" class="status-pill">NOT STARTED</span>
              <span class="streak-counter"><span aria-hidden="true">🔥</span> <span id="menuStreakVal">0</span></span>
            </div>
            <button id="menuStartTodayBtn" class="neo-btn action-btn primary-action">Play</button>
          </article>

          <!-- Vault Card -->
          <div class="menu-card vault-menu-card neo-glass-surface" id="menuVaultCard">
            <div class="subcard-header">
              <h2 class="section-title">Vault</h2>
              <span id="menuVaultCountBadge" class="subcard-badge">0</span>
            </div>
            <button id="menuOpenVaultBtn" class="neo-btn action-btn secondary-action">Open Vault</button>
          </div>
        </div>
      </section>

      <!-- ACTIVE GAME BOARD -->
      <section id="gameView" class="view-panel hidden" aria-label="Game Board">
        <div class="flight-meta-bar neo-glass-surface">
          <span id="flightDayLabel" class="flight-label">TODAY</span>
          <div id="flightStepper" class="stepper-track" role="progressbar" aria-valuenow="1" aria-valuemin="1" aria-valuemax="5">
            <div class="step-pip current" data-step="0">1</div>
            <div class="step-pip" data-step="1">2</div>
            <div class="step-pip" data-step="2">3</div>
            <div class="step-pip" data-step="3">4</div>
            <div class="step-pip" data-step="4">5</div>
          </div>
        </div>

        <article class="trivia-card neo-glass-surface" id="triviaCard">
          <header class="card-header">
            <div class="badge-cluster">
              <span id="curriculumBadge" class="neo-badge">CATEGORY</span>
              <span id="difficultyBadge" class="neo-badge difficulty-badge">DIFFICULTY</span>
            </div>
          </header>

          <div class="question-container">
            <h2 id="questionText" class="question-title">Question loading...</h2>
          </div>

          <div id="optionsGrid" class="options-grid" role="radiogroup" aria-labelledby="questionText">
            <!-- Dynamically populated -->
          </div>

          <div id="barNotePanel" class="bar-note-panel hidden" aria-live="polite">
            <h3 class="note-title">Explanation</h3>
            <p id="barNoteText" class="bar-note-text"></p>
            <div class="bar-note-action">
              <button id="nextQuestionBtn" class="neo-btn action-btn">Next</button>
            </div>
          </div>
        </article>
      </section>

      <!-- SCORECARD -->
      <section id="resultsView" class="view-panel hidden" aria-label="Scorecard">
        <div class="scorecard-card neo-glass-surface">
          <h2 class="score-title" id="scorecardRank">Scorecard</h2>
          <div class="score-display">
            <div class="score-circle">
              <span id="finalScoreVal" class="score-num">0</span>
              <span class="score-denom">/ 5</span>
            </div>
            <div class="score-breakdown" id="scorePillList"></div>
          </div>

          <div class="scorecard-actions">
            <button id="shareScoreBtn" class="neo-btn action-btn primary-action">Share</button>
            <div class="scorecard-button-row">
              <button id="reviewFlightBtn" class="neo-btn action-btn secondary-action">Review</button>
              <button id="goToVaultBtn" class="neo-btn action-btn secondary-action">Vault</button>
            </div>
            <button id="returnToMenuBtn" class="neo-btn action-btn tertiary-action">Menu</button>
          </div>
        </div>
      </section>

      <!-- THE VAULT -->
      <section id="vaultView" class="view-panel hidden" aria-label="Vault">
        <div class="vault-shell neo-glass-surface">
          <header class="vault-header">
            <h2 class="vault-title">Vault</h2>
          </header>

          <div id="vaultEmptyMessage" class="vault-empty-state hidden">
            <h3>Empty</h3>
            <button id="vaultBackToTodayBtn" class="neo-btn action-btn primary-action start-today-fallback">Play Today</button>
          </div>

          <div id="vaultGrid" class="vault-grid" role="list">
            <!-- Dynamically populated -->
          </div>
        </div>
      </section>

    </main>

    <!-- Toast Notification -->
    <div id="toastMessage" class="neo-toast" role="status" aria-live="polite" aria-hidden="true"></div>
  </div>

  <script src="./script.js"></script>
</body>
</html>
